<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Skin overlay FALLERO v3 — mocador + faja que ABRAZA el contorno +
       clavell. Faja: antes era un rect recto que sobresalía; ahora sus
       extremos se meten en las esquinas inferiores del cuerpo (que curvan
       de y≈282 a 340) y los bordes se comban como tela real. -->

  <defs>
    <linearGradient id="flMocador" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#A0091E"/>
    </linearGradient>
    <linearGradient id="flFaja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D93B3B"/>
      <stop offset="50%" stop-color="#B81E1E"/>
      <stop offset="100%" stop-color="#8B0820"/>
    </linearGradient>
    <radialGradient id="flContact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flAO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- ═══ MOCADOR (pañuelo) ═══ -->
  <g>
    <path d="M 105 100 Q 130 78 200 72 Q 270 78 295 100 Q 305 122 295 142
             L 285 145 Q 275 130 200 128 Q 125 130 115 145 L 105 142
             Q 95 122 105 100 Z"
          fill="url(#flMocador)" stroke="#5C0512" stroke-width="2.5"/>
    <path d="M 130 105 Q 200 92 270 105 Q 270 125 200 122 Q 130 125 130 105 Z"
          fill="#8B0820" opacity="0.35"/>
    <!-- Sombra bajo el borde del mocador (lo ancla al cuerpo) -->
    <path d="M 115 143 Q 200 132 285 143 Q 200 150 115 143 Z"
          fill="#000000" opacity="0.18"/>
    <g transform="translate(290, 130)">
      <ellipse cx="0" cy="0" rx="13" ry="10" fill="#A0091E" stroke="#5C0512" stroke-width="1.8"/>
      <ellipse cx="-2" cy="-2" rx="9" ry="6" fill="#D62828" opacity="0.7"/>
      <path d="M 8 5 L 28 38 L 35 45 L 25 50 L 12 40 L 5 18 Z"
            fill="url(#flMocador)" stroke="#5C0512" stroke-width="1.8"/>
      <path d="M 15 25 L 25 45" stroke="#5C0512" stroke-width="0.8" opacity="0.4"/>
    </g>
    <path d="M 108 130 L 80 158 L 78 168 L 88 168 L 110 152 Z"
          fill="url(#flMocador)" stroke="#5C0512" stroke-width="1.8"/>
    <g fill="#FFFFFF" opacity="0.92">
      <circle cx="138" cy="100" r="4.5"/><circle cx="160" cy="115" r="4"/>
      <circle cx="180" cy="98" r="3.8"/><circle cx="200" cy="115" r="4.5"/>
      <circle cx="220" cy="100" r="4"/><circle cx="240" cy="115" r="4.2"/>
      <circle cx="262" cy="102" r="3.8"/>
      <circle cx="150" cy="125" r="2.5" opacity="0.7"/><circle cx="190" cy="128" r="2.5" opacity="0.7"/>
      <circle cx="230" cy="128" r="2.5" opacity="0.7"/><circle cx="270" cy="125" r="2.5" opacity="0.7"/>
    </g>
    <path d="M 140 90 Q 200 80 260 90 Q 260 95 200 88 Q 140 95 140 90 Z"
          fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- ═══ FAJA que abraza el contorno ═══ -->
  <path d="M 70 279 Q 133 287 200 285 Q 267 287 330 279
           L 330 292 Q 267 300 200 298 Q 133 300 70 292 Z" fill="url(#flAO)"/>
  <g>
    <path d="M 66 291 Q 133 299 200 297 Q 267 299 334 291
             L 322 319 Q 267 328 200 326 Q 133 328 78 319 Z"
          fill="url(#flFaja)" stroke="#5C0512" stroke-width="2"/>
    <!-- Brillo superior de tela -->
    <path d="M 68 295 Q 134 303 200 301 Q 266 303 332 295"
          stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.16"/>
    <!-- Pliegues siguiendo la comba -->
    <g stroke="#5C0512" stroke-width="0.9" opacity="0.5" fill="none">
      <path d="M 95 297 Q 95 309 98 320"/>
      <path d="M 130 299 Q 130 311 131 322"/>
      <path d="M 165 300 Q 165 312 165 323"/>
      <path d="M 235 300 Q 235 312 235 323"/>
      <path d="M 270 299 Q 270 311 269 322"/>
      <path d="M 305 297 Q 305 309 302 320"/>
    </g>
    <!-- Sombra inferior sobre el cuerpo -->
    <path d="M 78 319 Q 133 328 200 326 Q 267 328 322 319
             L 318 326 Q 267 334 200 332 Q 133 334 82 326 Z"
          fill="#000000" opacity="0.15"/>
    <!-- Nudo a la izquierda con tela cayendo -->
    <g>
      <ellipse cx="72" cy="309" rx="12" ry="10" fill="#A0091E" stroke="#5C0512" stroke-width="1.8"/>
      <path d="M 62 316 L 40 344 L 34 362 L 48 356 L 64 334 Z"
            fill="url(#flFaja)" stroke="#5C0512" stroke-width="1.8"/>
      <path d="M 45 339 L 57 352" stroke="#5C0512" stroke-width="0.8" opacity="0.5"/>
      <path d="M 74 317 L 64 352 L 70 354 L 79 326 Z"
            fill="#A0091E" stroke="#5C0512" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ═══ CLAVELL ═══ -->
  <g transform="translate(332, 182)">
    <ellipse cx="-3" cy="9" rx="9" ry="3" fill="#1B5E20" transform="rotate(45)"/>
    <ellipse cx="3" cy="9" rx="9" ry="3" fill="#2E7D32" transform="rotate(-45)"/>
    <ellipse cx="0" cy="14" rx="7" ry="2.5" fill="#388E3C"/>
    <circle r="13" fill="#E63946" stroke="#8B0820" stroke-width="1"/>
    <g stroke="#A0091E" stroke-width="0.6" fill="none" opacity="0.6">
      <line x1="-10" y1="0" x2="10" y2="0"/><line x1="0" y1="-10" x2="0" y2="10"/>
      <line x1="-7" y1="-7" x2="7" y2="7"/><line x1="7" y1="-7" x2="-7" y2="7"/>
    </g>
    <circle r="9" fill="#D62828"/><circle r="6" fill="#A0091E"/>
    <circle r="2.5" fill="#FFE066"/><circle r="1.5" fill="#FFC857"/>
  </g>
</svg>
