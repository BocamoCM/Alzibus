<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Skin overlay UD ALZIRA v2 — bufanda rojigualda-morada, escudo y
       banderín. Añadidas sombras de contacto bajo la banda central y
       detrás de los extremos colgantes para que no parezcan pegados. -->

  <defs>
    <pattern id="udaStripes" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="6" height="12" fill="#C62828"/>
      <rect x="6" width="6" height="12" fill="#5D2E8C"/>
    </pattern>
    <pattern id="udaStripesFine" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="3" height="6" fill="#C62828"/>
      <rect x="3" width="3" height="6" fill="#5D2E8C"/>
    </pattern>
    <linearGradient id="fcVol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="fcContact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sombra de contacto de la bufanda sobre el techo -->
  <ellipse cx="200" cy="110" rx="110" ry="13" fill="url(#fcContact)"/>

  <!-- ═══ BUFANDA ═══ -->
  <g>
    <!-- Sombra proyectada del extremo izquierdo sobre el cuerpo -->
    <path d="M 85 80 L 75 145 L 95 150 L 105 95 Z"
          fill="#000000" opacity="0.14" transform="translate(5,4)"/>
    <!-- Extremo izquierdo -->
    <path d="M 85 80 L 75 145 L 95 150 L 105 95 Z" fill="url(#udaStripes)" stroke="#3D1A5C" stroke-width="2"/>
    <path d="M 85 80 L 75 145 L 95 150 L 105 95 Z" fill="url(#fcVol)"/>
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <line x1="78" y1="148" x2="76" y2="160"/><line x1="84" y1="148" x2="83" y2="162"/>
      <line x1="90" y1="150" x2="90" y2="163"/>
    </g>

    <!-- Sombra proyectada del extremo derecho -->
    <path d="M 295 95 L 305 150 L 325 145 L 315 80 Z"
          fill="#000000" opacity="0.14" transform="translate(5,4)"/>
    <!-- Extremo derecho -->
    <path d="M 295 95 L 305 150 L 325 145 L 315 80 Z" fill="url(#udaStripes)" stroke="#3D1A5C" stroke-width="2"/>
    <path d="M 295 95 L 305 150 L 325 145 L 315 80 Z" fill="url(#fcVol)"/>
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <line x1="310" y1="148" x2="312" y2="160"/><line x1="316" y1="148" x2="317" y2="162"/>
      <line x1="322" y1="150" x2="324" y2="163"/>
    </g>

    <!-- Banda central sobre el techo -->
    <path d="M 90 90 Q 200 70 310 90 Q 305 110 200 105 Q 95 110 90 90 Z"
          fill="url(#udaStripes)" stroke="#3D1A5C" stroke-width="2"/>
    <!-- Sombra interior inferior de la banda (volumen) -->
    <path d="M 95 103 Q 200 108 305 103 Q 305 109 200 106 Q 95 109 95 103 Z"
          fill="#000000" opacity="0.2"/>
    <!-- Cartela blanca -->
    <path d="M 130 90 Q 200 84 270 90 L 270 102 Q 200 96 130 102 Z" fill="#FFFFFF" opacity="0.95"/>
    <text x="200" y="100" font-family="Arial Black, Impact, sans-serif"
          font-weight="900" font-size="13" fill="#C62828"
          text-anchor="middle" letter-spacing="1.5">UD ALZIRA</text>
  </g>

  <!-- ═══ ESCUDO ═══ -->
  <g transform="translate(335, 200)">
    <path d="M -22 -25 L 22 -25 L 22 8 Q 22 22 0 30 Q -22 22 -22 8 Z"
          fill="#000000" opacity="0.28" transform="translate(3,4)"/>
    <path d="M -20 -23 L 20 -23 L 20 8 Q 20 22 0 30 Q -20 22 -20 8 Z"
          fill="url(#udaStripesFine)" stroke="#FFC857" stroke-width="2"/>
    <path d="M -20 -23 L 20 -23" stroke="#FFC857" stroke-width="3"/>
    <rect x="-15" y="-8" width="30" height="20" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <text x="0" y="5" font-family="Arial Black, sans-serif" font-weight="900" font-size="11"
          fill="#C62828" text-anchor="middle">UDA</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-weight="bold" font-size="5"
          fill="#5D2E8C" text-anchor="middle">ALZIRA</text>
  </g>

  <!-- ═══ BANDERÍN ═══ -->
  <g transform="translate(60, 175)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#8B6F1A" stroke-width="2.5"/>
    <path d="M 0 0 L 25 8 L 0 18 Z" fill="url(#udaStripes)" stroke="#3D1A5C" stroke-width="1.5"/>
  </g>
</svg>
