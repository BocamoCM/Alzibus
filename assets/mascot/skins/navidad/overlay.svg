<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Skin overlay NAVIDAD — gorro de Santa, bufanda y copos.

       Referencias del Albus base (viewBox 400x400):
       - Techo del bus: y ≈ 95-130. El gorro debe APOYARSE encima,
         con su ribete blanco descansando justo sobre el techo
         (y ≈ 100-115), no flotando ni metido dentro del cuerpo.
       - El cono cae lateralmente hacia la derecha (gorro de Santa
         típico), con el pompón al final. -->

  <defs>
    <linearGradient id="santaHatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#A02530"/>
    </linearGradient>
    <linearGradient id="santaHatShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="pompon" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#B8B8B8"/>
    </radialGradient>
    <radialGradient id="ribbet" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCDCDC"/>
    </radialGradient>
  </defs>

  <!-- ═══ GORRO DE SANTA ═══ -->
  <g>
    <!-- Base del cono: parte ancha apoyada en el techo (~y=100-110),
         curvándose hacia arriba y a la derecha, terminando en la
         punta donde está el pompón.
         Camino: parte de la izquierda del ribete (x=130, y=105),
         sube curvándose por arriba, cae hacia la derecha-arriba
         (y=20), y vuelve por la derecha del ribete (x=270, y=105). -->
    <path d="M 130 108
             Q 145 70 175 50
             Q 220 30 268 22
             Q 295 18 310 30
             Q 315 50 290 80
             Q 285 95 270 108
             Z"
          fill="url(#santaHatGrad)"
          stroke="#5C0E18" stroke-width="2.5"/>

    <!-- Sombreado de volumen del cono -->
    <path d="M 130 108
             Q 145 70 175 50
             Q 220 30 268 22
             Q 295 18 310 30
             Q 315 50 290 80
             Q 285 95 270 108
             Z"
          fill="url(#santaHatShade)"/>

    <!-- Pliegue sutil (línea de sombra interior) -->
    <path d="M 285 25 Q 260 50 230 70"
          stroke="#5C0E18" stroke-width="1.2" opacity="0.45" fill="none"/>

    <!-- Borde blanco peludo (ribete del gorro) apoyado en el techo.
         Tamaño: rx=80 ry=11, centrado en (200,108) — descansa sobre la
         curvatura superior del bus. -->
    <ellipse cx="200" cy="108" rx="78" ry="11"
             fill="url(#ribbet)" stroke="#5C0E18" stroke-width="2"/>

    <!-- Textura "pelusa" del ribete (pequeños círculos) -->
    <g fill="#FFFFFF" stroke="#D0D0D0" stroke-width="0.5">
      <circle cx="135" cy="106" r="4"/>
      <circle cx="150" cy="111" r="3.6"/>
      <circle cx="165" cy="106" r="4"/>
      <circle cx="180" cy="111" r="3.8"/>
      <circle cx="200" cy="107" r="4"/>
      <circle cx="220" cy="111" r="3.8"/>
      <circle cx="240" cy="106" r="4"/>
      <circle cx="255" cy="110" r="3.6"/>
      <circle cx="268" cy="106" r="4"/>
    </g>

    <!-- Pompón blanco grande en la punta del gorro -->
    <circle cx="305" cy="32" r="15" fill="url(#pompon)" stroke="#888" stroke-width="1.2"/>
    <!-- Brillo del pompón -->
    <circle cx="301" cy="28" r="4.5" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- ═══ BUFANDA roja con flecos ═══ -->
  <g>
    <!-- Cuerpo de la bufanda alrededor del cuello/cintura del bus -->
    <rect x="60" y="290" width="280" height="28" fill="url(#santaHatGrad)"
          stroke="#5C0E18" stroke-width="2"/>

    <!-- Rayas blancas tipo bufanda navideña -->
    <g fill="#FFFFFF">
      <rect x="60" y="293" width="280" height="3"/>
      <rect x="60" y="312" width="280" height="3"/>
    </g>

    <!-- Pliegues de tela -->
    <g stroke="#5C0E18" stroke-width="0.8" opacity="0.5" fill="none">
      <line x1="100" y1="290" x2="100" y2="318"/>
      <line x1="160" y1="290" x2="160" y2="318"/>
      <line x1="240" y1="290" x2="240" y2="318"/>
      <line x1="300" y1="290" x2="300" y2="318"/>
    </g>

    <!-- Extremo izquierdo de la bufanda colgando con FLECOS -->
    <path d="M 60 305 L 28 325 L 26 345 L 56 340 L 60 320 Z"
          fill="url(#santaHatGrad)" stroke="#5C0E18" stroke-width="2"/>
    <!-- Flecos del extremo -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <line x1="28" y1="345" x2="26" y2="358"/>
      <line x1="34" y1="345" x2="33" y2="360"/>
      <line x1="40" y1="345" x2="40" y2="362"/>
      <line x1="46" y1="345" x2="47" y2="360"/>
      <line x1="52" y1="345" x2="53" y2="358"/>
    </g>
  </g>

  <!-- ═══ COPOS DE NIEVE decorativos ═══ -->
  <g fill="#FFFFFF" stroke="#B0D8FF" stroke-width="0.8">
    <!-- Copo izquierdo -->
    <g transform="translate(40, 80)">
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle r="2.5" fill="#FFFFFF"/>
    </g>
    <!-- Copo derecho abajo (el de arriba lo ocupa ahora el pompón) -->
    <g transform="translate(360, 180)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="6" y1="-6" x2="-6" y2="6" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>
    <!-- Copo más pequeño -->
    <g transform="translate(80, 200)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle r="2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
